<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Matrícula - IAS</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <header>
        <h1>Simulador de Matrícula</h1>
        <p>Descubra se você tem direito à bolsa de estudos do IAS.</p>
    </header>

    <main>
        <section class="container-simulador">
            <form id="form-simulacao">
                
                <div class="campo">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="curso">Curso Desejado:</label>
                    <select id="curso" required>
                        <option value="">Selecione um curso...</option>
                        <option value="informatica">Técnico em Informática</option>
                        <option value="enfermagem">Técnico em Enfermagem</option>
                        <option value="computacao">Licenciatura em Computação</option>
                        <option value="administracao">Técnico em Administração</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="renda">Renda Familiar (R$):</label>
                    <input type="number" id="renda" placeholder="Ex: 1500" required min="0">
                </div>

                <button type="submit" id="btn-simular">Simular Matrícula</button>
            </form>

            <!-- O resultado aparecerá aqui -->
            <div id="resultado" class="resultado-box" style="display: none;">
                <h2>Resultado da Simulação</h2>
                <p id="texto-resultado"></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Instituto Arkham do Saber</p>
    </footer>

</body>
</html>
